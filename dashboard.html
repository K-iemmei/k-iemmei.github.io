<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard · Daily Practice</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="brand">
            <div class="brand-mark">D</div>
            <span>Daily Practice</span>
        </div>

        <nav class="nav">

            <a href="#" class="nav-item active">
                <span class="nav-icon">⌂</span>
                <span>Dashboard</span>
            </a>

        </nav>

        <div class="sidebar-bottom">
            <a href="#" class="nav-item">
                <span class="nav-icon">⚙</span>
                <span>Settings</span>
            </a>
        </div>

    </aside>


    <!-- Main -->
    <main class="main">

        <!-- Top bar -->
        <header class="topbar">

            <div class="mobile-brand">
                <div class="brand-mark">D</div>
                <span>Daily Practice</span>
            </div>

            <div class="topbar-actions">

                <button
                    id="themeToggle"
                    class="icon-button"
                    aria-label="Toggle theme"
                >
                    ☼
                </button>

                <button
                    id="logoutButton"
                    class="top-avatar logout-avatar"
                    type="button"
                    aria-label="Log out"
                    title="Log out"
                >
                    K
                </button>

            </div>

        </header>


        <div class="content">

            <!-- Greeting -->
            <section class="welcome">

                <div>
                    <p class="eyebrow">Saturday, August 8, 2026</p>

                    <h1>
                        Good morning, Kiểm.
                    </h1>

                </div>

            </section>


            <!-- Today's practice -->
            <section class="section">

                <div class="section-header">

                    <div>
                        <h2>Today's practice</h2>
                    </div>

                    <button class="view-button">
                        View all →
                    </button>

                </div>


                <div class="subject-grid">

                    <!-- English -->
                    <article class="subject-card" data-go="english.html">

                        <div class="subject-top">

                            <div class="subject-icon english">
                                EN
                            </div>

                            <span class="status-dot"></span>

                        </div>

                        <h3>English</h3>

                        <button class="subject-action" type="button" data-go="english.html">
                            Start now
                        </button>

                    </article>

                    <!-- Chinese -->
                    <article class="subject-card" data-go="chinese.html">

                        <div class="subject-top">

                            <div class="subject-icon chinese">
                                中
                            </div>

                            <span class="status-dot"></span>

                        </div>

                        <h3>中文</h3>

                        <button class="subject-action" type="button" data-go="chinese.html">
                            开始练习
                        </button>

                    </article>

                </div>

            </section>


            <!-- Activity -->
            <section class="section activity-section">

                <div class="section-header activity-header">

                    <div>
                        <h2>Activity</h2>
                    </div>

                    <label class="year-select-wrap" for="yearSelector">
                        <span>Year</span>
                        <select id="yearSelector" class="year-select" aria-label="Select year">
                            <option value="2026" selected>2026</option>
                            <option value="2025">2025</option>
                            <option value="2024">2024</option>
                        </select>
                    </label>

                </div>


                <!-- Overall stats -->
                <div class="activity-summary">

                    <div class="summary-item">

                        <strong id="activeDaysValue">0</strong>
                        <span>active days</span>

                    </div>

                    <div class="summary-item">

                        <strong id="dayStreakValue">0</strong>
                        <span>day streak</span>

                    </div>

                    <div class="summary-item">

                        <strong id="averageScoreValue">0/0</strong>
                        <span>average score</span>

                    </div>

                </div>


                <!-- English heatmap -->
                <div class="heatmap-card">

                    <div class="heatmap-header">

                        <div>
                            <h3>English</h3>
                        </div>

                        <strong>0 active days</strong>

                    </div>

                    <div class="heatmap-wrapper">

                        <div
                            id="heatmap-english"
                            class="heatmap"
                        ></div>

                    </div>

                </div>

                <div class="heatmap-card">

                    <div class="heatmap-header">

                        <div>
                            <h3>中文</h3>
                        </div>

                        <strong>0 active days</strong>

                    </div>

                    <div class="heatmap-wrapper">

                        <div
                            id="heatmap-chinese"
                            class="heatmap"
                        ></div>

                    </div>

                </div>

            </section>

        </div>

    </main>

</div>


<script src="js/supabase.js"></script>
<script src="js/dashboard.js"></script>

</body>
</html>
