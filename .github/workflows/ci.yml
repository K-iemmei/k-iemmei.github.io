name: Validate local application
on: [push, pull_request]
jobs:
    validate:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: my_note
                ports: ['5432:5432']
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        env:
            DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/my_note
            PUPPETEER_SKIP_DOWNLOAD: 'true'
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run format:check
            - run: npm run check
            - run: npm test
            - run: npm run test:integration
