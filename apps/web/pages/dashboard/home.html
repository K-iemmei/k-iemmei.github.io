<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <script>
            // Apply the saved theme before the first paint, without waiting for modules.
            try {
                if (localStorage.getItem('theme') === 'dark')
                    document.documentElement.dataset.theme = 'dark';
            } catch {
                // Storage can be unavailable; keep the default light theme.
            }
        </script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Home · Daily Practice</title>
        <link rel="stylesheet" href="styles/style.css" />
        <link rel="stylesheet" href="styles/pages/dashboard.css" />
        <link rel="stylesheet" href="styles/pages/home.css" />
        <link rel="stylesheet" href="styles/vintage.css" />
    </head>
    <body data-page="home">
        <div class="app pixel-theme">
            <aside class="sidebar" aria-label="Main navigation">
                <a class="brand" href="home.html"
                    ><span class="brand-mark"
                        ><svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.7"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M6 4h8l4 4v12H6zM14 4v5h4M9 13h6M9 16h4" /></svg></span
                    ><span>Daily Note</span></a
                >
                <div class="sidebar-nav-group">
                    <nav class="nav" aria-label="Sidebar navigation">
                        <a class="nav-item active" href="home.html" aria-current="page"
                            ><span class="nav-icon"
                                ><svg
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.7"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    aria-hidden="true"
                                >
                                    <path
                                        d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"
                                    /></svg></span
                            ><span>Home</span></a
                        ><a class="nav-item" href="dashboard.html"
                            ><span class="nav-icon"
                                ><svg
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.7"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    aria-hidden="true"
                                >
                                    <rect x="3" y="3" width="7" height="7" rx="2" />
                                    <rect x="14" y="3" width="7" height="7" rx="2" />
                                    <rect x="3" y="14" width="7" height="7" rx="2" />
                                    <rect x="14" y="14" width="7" height="7" rx="2" /></svg></span
                            ><span>Learning</span></a
                        ><a class="nav-item" href="blog.html"
                            ><span class="nav-icon"
                                ><svg
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.7"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    aria-hidden="true"
                                >
                                    <path
                                        d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"
                                    /></svg></span
                            ><span>Blog</span></a
                        ><a class="nav-item" href="notes.html"
                            ><span class="nav-icon"
                                ><svg
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.7"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    aria-hidden="true"
                                >
                                    <rect x="5" y="3" width="15" height="18" rx="2" />
                                    <path d="M3 7h4M3 12h4M3 17h4M11 8h5M11 12h5" /></svg></span
                            ><span>Note</span></a
                        >
                    </nav>
                </div>
                <div class="sidebar-bottom">
                    <div class="sidebar-account">
                        <span class="avatar top-avatar" aria-hidden="true">U</span>
                        <div class="sidebar-account-copy">
                            <span id="sidebarUserName">Your account</span>
                        </div>
                    </div>
                    <button
                        id="themeToggle"
                        class="sidebar-action sidebar-theme"
                        type="button"
                        role="switch"
                        aria-label="Dark mode"
                        aria-checked="false"
                        data-theme-switch
                    >
                        <span class="sidebar-action-icon"
                            ><svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.7"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                aria-hidden="true"
                            >
                                <path
                                    d="M20.5 13a8.5 8.5 0 0 1-9.5-9.5A8.5 8.5 0 1 0 20.5 13Z"
                                /></svg></span
                        ><span>Dark mode</span
                        ><span class="theme-switch-track" aria-hidden="true"><span></span></span>
                    </button>
                    <button id="logoutButton" class="sidebar-action sidebar-logout" type="button">
                        <span class="sidebar-action-icon"
                            ><svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.7"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                aria-hidden="true"
                            >
                                <path
                                    d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4M14 8l4 4-4 4M8 12h13"
                                /></svg></span
                        ><span>Log out</span>
                    </button>
                </div>
            </aside>

            <main class="main home-main">
                <header class="home-heading">
                    <div>
                        <p id="homeDate"></p>
                        <h1 id="homeGreeting">Today</h1>
                    </div>
                </header>
                <div class="daily-grid">
                    <section class="daily-panel weather-panel" aria-labelledby="weatherHeading">
                        <div class="daily-panel-heading">
                            <h2 id="weatherHeading">Weather</h2>
                            <button id="weatherRefresh" type="button" aria-label="Refresh weather">
                                ↻
                            </button>
                        </div>
                        <form id="citySearchForm" class="inline-form">
                            <label class="home-sr-only" for="citySearch">City</label
                            ><input
                                id="citySearch"
                                type="search"
                                placeholder="Search a city…"
                                maxlength="100"
                                required
                                minlength="2"
                                autocomplete="off"
                            /><button type="submit">Search</button>
                        </form>
                        <div id="cityResults"></div>
                        <div id="weatherContent" aria-live="polite">
                            <p class="home-muted">Choose a city to see its weather.</p>
                        </div>
                        <p id="weatherMessage" class="home-message" role="status"></p>
                        <a
                            class="home-source"
                            href="https://open-meteo.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                            >Open-Meteo · GeoNames</a
                        >
                    </section>
                    <section class="daily-panel todo-panel" aria-labelledby="todoHeading">
                        <div class="daily-panel-heading">
                            <h2 id="todoHeading">To-do</h2>
                            <span id="todoCount" class="home-muted"></span>
                        </div>
                        <div class="todo-toolbar">
                            <label><input id="pinnedOnly" type="checkbox" /> Pinned only</label
                            ><button id="todoRefresh" type="button">Refresh</button>
                        </div>
                        <p id="todoMessage" class="home-message" role="status">Loading tasks…</p>
                        <ul id="todoList" class="todo-list" aria-label="Your tasks"></ul>
                        <form id="todoForm" class="inline-form">
                            <label class="home-sr-only" for="todoInput">New task</label
                            ><input
                                id="todoInput"
                                maxlength="300"
                                placeholder="Add a task…"
                                required
                            /><button type="submit">Add</button>
                        </form>
                    </section>
                    <section class="daily-panel news-panel" aria-labelledby="newsHeading">
                        <div class="daily-panel-heading">
                            <h2 id="newsHeading">News</h2>
                            <div class="news-controls">
                                <label class="home-sr-only" for="newsCategory">News category</label
                                ><select id="newsCategory">
                                    <option value="latest">Highlights</option>
                                    <option value="football">Football</option>
                                    <option value="sports">Sports</option>
                                    <option value="world">World</option>
                                    <option value="business">Business</option>
                                    <option value="technology">Technology</option>
                                    <option value="science">Science</option>
                                    <option value="health">Health</option>
                                    <option value="lifestyle">Lifestyle</option>
                                    <option value="entertainment">Entertainment</option></select
                                ><button id="newsRefresh" type="button" aria-label="Refresh news">
                                    ↻
                                </button>
                            </div>
                        </div>
                        <p id="newsMessage" class="home-message" role="status">Loading news…</p>
                        <div id="newsList" class="news-list"></div>
                        <a
                            class="home-source"
                            href="https://vnexpress.net/"
                            target="_blank"
                            rel="noopener noreferrer"
                            >VnExpress</a
                        >
                    </section>
                    <section class="daily-panel football-panel" aria-labelledby="footballHeading">
                        <div class="daily-panel-heading">
                            <h2 id="footballHeading">Football standings</h2>
                            <label
                                ><span class="home-sr-only">League</span
                                ><select id="footballLeague" aria-label="League"></select
                            ></label>
                        </div>
                        <p id="footballMessage" class="home-message" role="status">
                            Loading standings...
                        </p>
                        <div class="football-table-wrap" id="footballTable" hidden>
                            <table class="football-table">
                                <caption class="home-sr-only">
                                    League standings
                                </caption>
                                <thead>
                                    <tr>
                                        <th scope="col">#</th>
                                        <th scope="col">Club</th>
                                        <th scope="col"><abbr title="Played">P</abbr></th>
                                        <th scope="col" class="football-detail">
                                            <abbr title="Won">W</abbr>
                                        </th>
                                        <th scope="col" class="football-detail">
                                            <abbr title="Drawn">D</abbr>
                                        </th>
                                        <th scope="col" class="football-detail">
                                            <abbr title="Lost">L</abbr>
                                        </th>
                                        <th scope="col"><abbr title="Goal difference">GD</abbr></th>
                                        <th scope="col"><abbr title="Points">Pts</abbr></th>
                                    </tr>
                                </thead>
                                <tbody id="footballRows"></tbody>
                            </table>
                        </div>
                        <div class="football-footer">
                            <button
                                id="footballExpand"
                                type="button"
                                aria-expanded="false"
                                aria-controls="footballRows"
                                hidden
                            >
                                Full table</button
                            ><button id="footballRetry" type="button" hidden>Retry</button
                            ><a
                                id="footballSource"
                                class="home-source"
                                href="https://www.espn.com/soccer/standings/_/league/eng.1"
                                target="_blank"
                                rel="noopener noreferrer"
                                hidden
                                >ESPN</a
                            >
                        </div>
                    </section>
                </div>
            </main>
        </div>
        <script type="module" src="src/app.js"></script>
    </body>
</html>
