<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <script>
            // Apply the saved theme before the first paint, without waiting for modules.
            try {
                if (localStorage.getItem('theme') === 'dark')
                    document.documentElement.dataset.theme = 'dark';
            } catch {
                // Storage can be unavailable; keep the default light theme.
            }
        </script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Listening Library | My Note</title>
        <link rel="stylesheet" href="styles/style.css" />
        <link rel="stylesheet" href="styles/pages/english-library.css" />
        <link rel="stylesheet" href="styles/vintage.css" />
    </head>
    <body data-page="listening-library">
        <main class="page-shell">
            <header class="topbar">
                <div class="brand-row">
                    <a class="back-link" href="dashboard.html">&larr; Dashboard</a>
                </div>
                <div class="library-actions">
                    <button
                        id="themeToggle"
                        class="secondary-button"
                        type="button"
                        aria-label="Dark mode"
                        role="switch"
                        aria-checked="false"
                        data-theme-switch
                    >
                        Theme
                    </button>
                </div>
            </header>
            <section class="hero">
                <h1>Listening Library</h1>
                <div class="stats-row">
                    <span class="stat-pill" id="listeningCount" role="status"
                        >Loading parts...</span
                    >
                </div>
            </section>
            <section class="filter-panel" aria-label="Listening part filters">
                <label class="filter-field">
                    <span>Search by title, test or part</span>
                    <input
                        id="listeningSearch"
                        type="search"
                        placeholder="Search Cambridge, test or part..."
                        autocomplete="off"
                    />
                </label>
                <label class="filter-field">
                    <span>Book</span>
                    <select id="listeningBookFilter">
                        <option value="all">All books</option>
                    </select>
                </label>
            </section>
            <div id="listeningGrid" class="test-grid" aria-live="polite"></div>
            <nav
                id="listeningPages"
                class="library-pagination"
                aria-label="Listening library pages"
                hidden
            ></nav>
            <div id="listeningEmpty" class="empty-state" role="status">
                No listening parts found.
            </div>
        </main>
        <script type="module" src="src/app.js"></script>
    </body>
</html>
