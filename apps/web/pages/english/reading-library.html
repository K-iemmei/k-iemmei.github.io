<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <script>
            // Apply the saved theme before the first paint, without waiting for modules.
            try {
                if (localStorage.getItem('theme') === 'dark')
                    document.documentElement.dataset.theme = 'dark';
            } catch {
                // Storage can be unavailable; keep the default light theme.
            }
        </script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Reading Library</title>
        <link rel="stylesheet" href="styles/style.css" />
        <link rel="stylesheet" href="styles/pages/reading-library.css" />
    </head>
    <body data-page="reading-library">
        <div class="page-shell">
            <header class="topbar">
                <div class="brand-row">
                    <a class="back-link" href="dashboard.html">← Dashboard</a>
                    <span class="brand-pill">English Reading</span>
                </div>
                <a class="primary-button" href="admin.html">Create reading test</a>
            </header>

            <section class="hero">
                <h1>Reading Library</h1>
                <p>
                    Practice reading tests written by you. Create a test in Authoring, then return
                    here to practise.
                </p>
                <div class="stats-row">
                    <span class="stat-pill" id="testCountPill">Loading tests...</span>

                    <span class="stat-pill">Manually authored</span>
                </div>
            </section>

            <section class="filter-panel" aria-label="Reading test filters">
                <label class="filter-field">
                    <span>Search by title or category</span>
                    <input
                        id="searchInput"
                        type="search"
                        placeholder="Search your tests..."
                        autocomplete="off"
                    />
                </label>
                <label class="filter-field">
                    <span>Category</span>
                    <select id="categoryFilter">
                        <option value="all">All categories</option>
                    </select>
                </label>
            </section>

            <div id="testGrid" class="test-grid" aria-live="polite"></div>
            <nav
                id="libraryPagination"
                class="library-pagination"
                aria-label="Reading library pages"
                hidden
            ></nav>
            <div id="emptyState" class="empty-state">
                No tests found. Use Create reading test to write your first one.
            </div>
        </div>
        <script type="module" src="src/app.js"></script>
    </body>
</html>
